version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campaign-backend
    ports:
      - "8080:8080"
    environment:
      # Database connection (Supabase)
      - DB_HOST=${DB_HOST:-aws-0-ap-northeast-1.pooler.supabase.com}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-postgres}
      # Email SMTP config
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-kudokaito15903@gmail.com}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-bylqyvdcnoalwbif}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campaign-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
